<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="converter-container">

        <div class="icon">🌡️</div>

        <h1>Temperature Converter</h1>
        <p class="subtitle">
            Convert temperatures between Celsius, Fahrenheit and Kelvin
        </p>

        <div class="converter-card">

            <div class="input-group">
                <label for="temperature">Temperature</label>

                <input
                    type="text"
                    id="temperature"
                    placeholder="Enter temperature"
                    autocomplete="off"
                >

                <p id="error-message"></p>
            </div>

            <div class="input-group">
                <label for="unit">Input Unit</label>

                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <button id="convert-btn">
                Convert Temperature
            </button>

            <div id="results" class="results hidden">

                <h2>Converted Temperature</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span class="result-label">Celsius</span>
                        <span id="celsius-result" class="result-value">--</span>
                        <span class="unit">°C</span>
                    </div>

                    <div class="result-box">
                        <span class="result-label">Fahrenheit</span>
                        <span id="fahrenheit-result" class="result-value">--</span>
                        <span class="unit">°F</span>
                    </div>

                    <div class="result-box">
                        <span class="result-label">Kelvin</span>
                        <span id="kelvin-result" class="result-value">--</span>
                        <span class="unit">K</span>
                    </div>

                </div>

            </div>

        </div>

        <p class="footer">
            Simple • Fast • Accurate
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
